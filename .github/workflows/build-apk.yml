name: Build Speedline IPTV APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Rebuild source archive
        run: |
          cat ci/source/part_*.b64 | base64 -d > SpeedlineIPTV-v0.1.2-buildready.zip
          unzip -q SpeedlineIPTV-v0.1.2-buildready.zip -d build-src

      - name: Build debug APK
        working-directory: build-src/SpeedlineIPTV
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeedlineIPTV-debug-apk
          path: build-src/SpeedlineIPTV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build Speedline IPTV APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Rebuild source archive
        run: |
          cat ci/source/part_*.b64 | base64 -d > SpeedlineIPTV-v0.1.2-buildready.zip
          unzip -q SpeedlineIPTV-v0.1.2-buildready.zip -d build-src

      - name: Build debug APK
        working-directory: build-src/SpeedlineIPTV
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeedlineIPTV-debug-apk
          path: build-src/SpeedlineIPTV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-portal-v032:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Portal source branch
        uses: actions/checkout@v4
        with:
          ref: agent/stalker-v031

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Rebuild verified v0.2.1 base
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/build-apk.yml').read_text().splitlines()
          start = next(i for i,l in enumerate(lines) if '- name: Rebuild source and apply v0.2.1 fixes' in l)
          runline = next(i for i in range(start+1, len(lines)) if lines[i].strip() == 'run: |')
          end = next(i for i in range(runline+1, len(lines)) if lines[i].startswith('      - name: Build debug APKs'))
          body = []
          for line in lines[runline+1:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/rebuild-v021.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/rebuild-v021.sh

      - name: Apply Portal source and v0.3.2 fixes
        run: |
          ROOT=build-src/SpeedlineIPTV/app/src/main/java/al/speedline/iptv
          cp ci/stalker-src/AppConfig.kt "$ROOT/AppConfig.kt"
          cp ci/stalker-src/CredentialsStore.kt "$ROOT/data/CredentialsStore.kt"
          cp ci/stalker-src/XtreamApi.kt "$ROOT/data/XtreamApi.kt"
          cp ci/stalker-src/XtreamRepository.kt "$ROOT/data/XtreamRepository.kt"
          cp ci/stalker-src/AdminScreens.kt "$ROOT/ui/AdminScreens.kt"
          cp ci/stalker-src/LoginScreen.kt "$ROOT/ui/LoginScreen.kt"
          cp ci/stalker-src/BrowseScreen.kt "$ROOT/ui/BrowseScreen.kt"
          python3 ci/stalker-src/apply_v031.py

      - name: Build Portal ARM32 and ARM64 APKs
        working-directory: build-src/SpeedlineIPTV
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare Portal artifacts
        run: |
          set -e
          ARM32=$(find build-src/SpeedlineIPTV/app/build/outputs/apk/debug -name '*armeabi-v7a*.apk' | head -1)
          ARM64=$(find build-src/SpeedlineIPTV/app/build/outputs/apk/debug -name '*arm64-v8a*.apk' | head -1)
          test -n "$ARM32" -a -f "$ARM32"
          test -n "$ARM64" -a -f "$ARM64"
          cp "$ARM32" SpeedlineIPTV-Portal-v0.3.2-ARM32.apk
          cp "$ARM64" SpeedlineIPTV-Portal-v0.3.2-ARM64.apk
          sha256sum SpeedlineIPTV-Portal-v0.3.2-ARM32.apk SpeedlineIPTV-Portal-v0.3.2-ARM64.apk > SpeedlineIPTV-Portal-v0.3.2.sha256
          ls -lh SpeedlineIPTV-Portal-v0.3.2-*.apk

      - name: Upload Portal APKs
        uses: actions/upload-artifact@v4
        with:
          name: SpeedlineIPTV-Portal-v0.3.2
          path: |
            SpeedlineIPTV-Portal-v0.3.2-ARM32.apk
            SpeedlineIPTV-Portal-v0.3.2-ARM64.apk
            SpeedlineIPTV-Portal-v0.3.2.sha256
          if-no-files-found: error

name: Build Speedline IPTV Stalker Universal

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  build-stalker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Rebuild source and apply Stalker overlay
        run: |
          cat ci/source/part_*.b64 | tr -d '\r\n' | base64 -d > base.zip
          unzip -q base.zip -d build-src
          sed -i '/org.jetbrains.kotlin.android/d' build-src/SpeedlineIPTV/build.gradle.kts

          cat ci/v015/part_*.b64 | tr -d '\r\n' | base64 -d > v015.zip
          unzip -oq v015.zip -d build-src/SpeedlineIPTV
          cat ci/v016/part_*.b64 | tr -d '\r\n' | base64 -d > v016.zip
          unzip -oq v016.zip -d build-src/SpeedlineIPTV
          cat ci/v017/part_*.b64 | tr -d '\r\n' | base64 -d > v017.zip
          unzip -oq v017.zip -d build-src/SpeedlineIPTV
          cp ci/v017fix/BrowseScreen.kt build-src/SpeedlineIPTV/app/src/main/java/al/speedline/iptv/ui/BrowseScreen.kt
          cat ci/v019/part_*.b64 | tr -d '\r\n' | base64 -d > v019.zip
          unzip -oq v019.zip -d build-src/SpeedlineIPTV

          cat ci/stalker/part_*.b64 | tr -d '\r\n' | base64 -d > stalker-overlay.zip
          unzip -oq stalker-overlay.zip -d build-src/SpeedlineIPTV/app/src/main/java

          sed -i '/org.jetbrains.kotlin.android/d' build-src/SpeedlineIPTV/app/build.gradle.kts

          python3 - <<'PY'
          from pathlib import Path
          p = Path('build-src/SpeedlineIPTV/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('versionCode = 9', 'versionCode = 12')
          s = s.replace('versionName = "0.1.9"', 'versionName = "0.3.0-stalker"')
          if 'abiFilters' not in s:
              s = s.replace('defaultConfig {', 'defaultConfig {\n        ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }', 1)
          p.write_text(s)
          PY

          echo 'Stalker universal source prepared.'
          grep -n 'versionName\|abiFilters' build-src/SpeedlineIPTV/app/build.gradle.kts

      - name: Build universal ARM APK
        working-directory: build-src/SpeedlineIPTV
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          ls -lh build-src/SpeedlineIPTV/app/build/outputs/apk/debug/*.apk
          cp build-src/SpeedlineIPTV/app/build/outputs/apk/debug/app-debug.apk SpeedlineIPTV-Stalker-v0.3.0-universal-arm.apk
          sha256sum SpeedlineIPTV-Stalker-v0.3.0-universal-arm.apk > SpeedlineIPTV-Stalker-v0.3.0-universal-arm.sha256

      - name: Upload universal Stalker APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeedlineIPTV-Stalker-v0.3.0-universal-arm
          path: |
            SpeedlineIPTV-Stalker-v0.3.0-universal-arm.apk
            SpeedlineIPTV-Stalker-v0.3.0-universal-arm.sha256
          if-no-files-found: error

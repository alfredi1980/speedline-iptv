name: Build Speedline IPTV Stalker Universal

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  build-stalker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Rebuild verified v0.2.1 source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/build-apk.yml').read_text().splitlines()
          start = next(i for i,l in enumerate(lines) if '- name: Rebuild source and apply v0.2.1 fixes' in l)
          runline = next(i for i in range(start+1, len(lines)) if lines[i].strip() == 'run: |')
          end = next(i for i in range(runline+1, len(lines)) if lines[i].startswith('      - name: Build debug APKs'))
          body=[]
          for line in lines[runline+1:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/rebuild-v021.sh').write_text('\n'.join(body)+'\n')
          PY
          bash /tmp/rebuild-v021.sh

      - name: Apply Stalker portal source
        run: |
          ROOT=build-src/SpeedlineIPTV/app/src/main/java/al/speedline/iptv
          cp ci/stalker-src/AppConfig.kt "$ROOT/AppConfig.kt"
          cp ci/stalker-src/CredentialsStore.kt "$ROOT/data/CredentialsStore.kt"
          cp ci/stalker-src/XtreamApi.kt "$ROOT/data/XtreamApi.kt"
          cp ci/stalker-src/XtreamRepository.kt "$ROOT/data/XtreamRepository.kt"
          cp ci/stalker-src/AdminScreens.kt "$ROOT/ui/AdminScreens.kt"

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('build-src/SpeedlineIPTV/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('versionCode = 11', 'versionCode = 12')
          s = s.replace('versionName = "0.2.1"', 'versionName = "0.3.0-stalker"')
          s = re.sub(r'\n\s*split[s]?\s*\{.*?\n\s*buildFeatures\s*\{', '\n\n    buildFeatures {', s, flags=re.S)
          if 'abiFilters' not in s:
              s = s.replace('defaultConfig {', 'defaultConfig {\n        ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }', 1)
          p.write_text(s)
          PY

          echo 'Stalker universal source prepared.'
          grep -n 'versionName\|abiFilters\|splits' build-src/SpeedlineIPTV/app/build.gradle.kts || true

      - name: Build universal ARM APK
        working-directory: build-src/SpeedlineIPTV
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          ls -lh build-src/SpeedlineIPTV/app/build/outputs/apk/debug/*.apk
          APK=$(find build-src/SpeedlineIPTV/app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$APK" SpeedlineIPTV-Stalker-v0.3.0-universal-arm.apk
          sha256sum SpeedlineIPTV-Stalker-v0.3.0-universal-arm.apk > SpeedlineIPTV-Stalker-v0.3.0-universal-arm.sha256

      - name: Upload universal Stalker APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeedlineIPTV-Stalker-v0.3.0-universal-arm
          path: |
            SpeedlineIPTV-Stalker-v0.3.0-universal-arm.apk
            SpeedlineIPTV-Stalker-v0.3.0-universal-arm.sha256
          if-no-files-found: error
